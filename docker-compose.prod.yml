services:
  postgres:
    image: postgres:17-alpine
    container_name: hiservis-postgres
    restart: always
    environment:
      POSTGRES_DB: hiservis_prod
      POSTGRES_USER: hiservis_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-HiServis2026_SecurePass!}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./packages/database/sql/02_rls.sql:/docker-entrypoint-initdb.d/02_rls.sql:ro
      - ./packages/database/sql/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiservis_app -d hiservis_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hiservis-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=hiservis_prod;Username=hiservis_app;Password=${DB_PASSWORD:-HiServis2026_SecurePass!}"
      Jwt__Secret: "HiServis_Super_Secret_Production_Key_2026_For_Jwt_Auth_Production!"
      Jwt__Issuer: "HiServis.Api"
      Jwt__Audience: "HiServis.Clients"
    ports:
      - "127.0.0.1:5254:5254"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: hiservis-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://hitek.hayatisleri.com.tr"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
